name: Personal OS batch 1 isolated checks

on:
  push:
    branches: [codex/personal-os-confirmation-batch1]

permissions:
  contents: read

concurrency:
  group: personal-os-batch1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test with disposable synthetic PostgreSQL only
        shell: bash
        run: |
          set -o pipefail
          bash backend/test.sh 2>&1 | tee "$RUNNER_TEMP/batch1-test.log"
      - name: Build Java artifact
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Freeze tracked source and test evidence
        if: always()
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/decision-tested-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git status --short > "$RUNNER_TEMP/source-status.txt"
          sha256sum "$RUNNER_TEMP/decision-tested-source.tar.gz" > "$RUNNER_TEMP/source-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: personal-os-batch1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/decision-tested-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-status.txt
            ${{ runner.temp }}/source-sha256.txt
            ${{ runner.temp }}/batch1-test.log
            backend/target/surefire-reports/
          retention-days: 7
