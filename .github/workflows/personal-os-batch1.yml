name: Personal OS batch 1 isolated checks

on:
  push:
    branches: [codex/personal-os-confirmation-batch1]

permissions:
  contents: read

concurrency:
  group: personal-os-batch1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test with disposable synthetic PostgreSQL only
        shell: bash
        run: bash backend/test.sh
      - name: Build Java artifact
        working-directory: backend
        run: ./mvnw -B -DskipTests package
      - name: Freeze source and test evidence
        if: always()
        shell: bash
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/decision-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          sha256sum "$RUNNER_TEMP/decision-source.tar.gz" > "$RUNNER_TEMP/source-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-os-batch1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/decision-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/source-sha256.txt
            backend/target/surefire-reports/
            backend/target/test-run.log
          retention-days: 7
