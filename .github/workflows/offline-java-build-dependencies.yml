name: Offline Java build dependencies
on:
  push:
    branches: [codex/progress-build-support]
    paths: [.github/workflows/offline-java-build-dependencies.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch open-source build dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline/probe/src/test/java/check"
          cat > "$RUNNER_TEMP/offline/probe/pom.xml" <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><parent><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-parent</artifactId><version>3.5.16</version></parent><groupId>local.build</groupId><artifactId>dependency-probe</artifactId><version>1</version><properties><java.version>17</java.version></properties><dependencies>
          <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-web</artifactId></dependency>
          <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-jdbc</artifactId></dependency>
          <dependency><groupId>org.springframework.boot</groupId><artifactId>spring-boot-starter-test</artifactId><scope>test</scope></dependency>
          <dependency><groupId>com.h2database</groupId><artifactId>h2</artifactId><scope>runtime</scope></dependency>
          <dependency><groupId>org.postgresql</groupId><artifactId>postgresql</artifactId><scope>runtime</scope></dependency>
          <dependency><groupId>org.apache.pdfbox</groupId><artifactId>pdfbox</artifactId><version>3.0.8</version></dependency>
          <dependency><groupId>org.apache.poi</groupId><artifactId>poi-ooxml</artifactId><version>5.4.1</version></dependency>
          <dependency><groupId>org.apache.poi</groupId><artifactId>poi-scratchpad</artifactId><version>5.4.1</version></dependency>
          </dependencies><build><plugins><plugin><groupId>org.springframework.boot</groupId><artifactId>spring-boot-maven-plugin</artifactId><configuration><skip>true</skip></configuration></plugin></plugins></build></project>
          EOF
          echo 'package check; class DependenciesTest { @org.junit.jupiter.api.Test void bootstrapsJUnit() { org.junit.jupiter.api.Assertions.assertTrue(true); } }' > "$RUNNER_TEMP/offline/probe/src/test/java/check/DependenciesTest.java"
          mvn -B -f "$RUNNER_TEMP/offline/probe/pom.xml" dependency:go-offline
          mvn -B -f "$RUNNER_TEMP/offline/probe/pom.xml" package
          mvn -B -f backend/pom.xml -DskipTests package
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o "$RUNNER_TEMP/offline/apache-maven-3.9.9-bin.tar.gz"
          tar -czf "$RUNNER_TEMP/offline/maven-repository.tar.gz" -C "$HOME/.m2" repository
          (cd "$RUNNER_TEMP/offline" && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-java-dependencies
          path: |
            ${{ runner.temp }}/offline/apache-maven-3.9.9-bin.tar.gz
            ${{ runner.temp }}/offline/maven-repository.tar.gz
            ${{ runner.temp }}/offline/SHA256SUMS
          retention-days: 3
