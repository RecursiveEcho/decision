<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Decision · 运行状态</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
<main>
  <h1>Decision</h1>
  <p>Preview · 运行状态与诊断</p>
  <p id="status" role="status">正在启动本机服务…</p>
  <dl id="services"></dl>
  <div class="actions">
    <button id="open" hidden>打开 Decision</button>
    <button id="retry" hidden>重试启动</button>
    <button id="logs">打开日志目录</button>
    <button id="code">查看管理员访问码</button>
  </div>
  <output id="owner-code" hidden></output>
  <section aria-label="应用设置">
    <p>模型、外观、输入偏好和记忆状态已集中到应用设置。登录后可配置自己的 OpenAI 或 DeepSeek 模型。</p>
    <button id="settings" disabled>打开应用设置</button>
    <p id="saved" role="status"></p>
  </section>
</main>
</body>
</html>
